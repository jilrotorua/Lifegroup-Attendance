<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="config.js"></script><title>Church Admin | Lifegroup Attendance</title><style>body{margin:0;background:#f3f6fa;color:#14243a;font-family:Arial,sans-serif}.top{background:linear-gradient(135deg,#102f5b,#2166a9);color:#fff;padding:20px}.top h1{margin:0;font-size:22px}.wrap{max-width:900px;margin:auto;padding:20px}.login,.card{background:#fff;border:1px solid #dce4ef;border-radius:17px;padding:17px;margin-bottom:12px}.login{max-width:430px;margin:40px auto}.row{display:flex;gap:10px}.row>*{flex:1}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;font:inherit}input{border:1px solid #cbd6e4}button{border:0;background:#123b70;color:#fff;font-weight:700;cursor:pointer}.toolbar{display:flex;gap:9px;margin-bottom:15px}.toolbar input{background:#fff}.card-head{display:flex;justify-content:space-between}.card h2{font-size:17px;margin:0}.card small,.muted{color:#6c7888}.total{font-size:27px;color:#123b70;font-weight:800}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.counts span{text-align:center;padding:10px;background:#eef4fb;border-radius:10px;font-weight:800}.counts small{display:block;font-weight:400}.empty{text-align:center;color:#6c7888;padding:35px}.error{color:#9d2525}@media(max-width:520px){.row,.toolbar{display:block}.toolbar>*{margin-bottom:8px}}</style></head><body><header class="top"><h1>JIL Lifegroup Attendance — Admin</h1></header><main class="wrap"><section class="login" id="login"><h2>Church Admin access</h2><p class="muted">Enter the Admin PIN created during setup.</p><input id="pin" type="password" inputmode="numeric" placeholder="Admin PIN"><button style="margin-top:10px" onclick="loadReports()">Open dashboard</button><p id="loginError" class="error"></p></section><section id="dashboard" hidden><div class="toolbar"><input id="search" placeholder="Search Lifegroup or leader" oninput="render()"><input id="month" type="month" oninput="render()"><button onclick="loadReports()">Refresh</button></div><div id="list"></div></section></main><script>let reports=[];async function loadReports(){const api=window.APP_CONFIG?.API_URL;if(!api||api.includes('PASTE-'))return document.getElementById('loginError').textContent='The database connection has not been configured.';try{const r=await fetch(api+'/reports',{headers:{'x-admin-pin':document.getElementById('pin').value}});if(!r.ok)throw new Error();reports=(await r.json()).reports||[];document.getElementById('login').hidden=true;document.getElementById('dashboard').hidden=false;render()}catch(e){document.getElementById('loginError').textContent='Incorrect PIN or the database could not be reached.'}}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=document.getElementById('search').value.toLowerCase(),m=document.getElementById('month').value,rows=reports.filter(r=>(r.lifegroup+' '+r.leader).toLowerCase().includes(q)&&(!m||r.date.startsWith(m)));document.getElementById('list').innerHTML=rows.length?rows.map(r=>`<article class="card"><div class="card-head"><div><h2>${esc(r.lifegroup)}</h2><small>${esc(r.leader)} · ${esc(r.date)} · ${esc(r.type)}</small></div><span class="total">${r.present.length+r.first+r.returning}</span></div><div class="counts"><span>${r.present.length}<small>Members</small></span><span>${r.first}<small>First-time</small></span><span>${r.returning}<small>Returning</small></span></div><details><summary>View names and notes</summary><p><b>Present:</b> ${esc(r.present.join(', ')||'None listed')}</p><p><b>Notes:</b> ${esc(r.notes||'None')}</p></details></article>`).join(''):'<div class="empty">No matching reports.</div>'}</script></body></html>
